<!doctype html><html><head><meta charset="utf-8"><title>Monopoly test</title>
<style>body{margin:0;background:#111}#game{width:100vw;height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script></head>
<body><div id="game"></div>
<script>
const q=new URLSearchParams(location.search);
const params={};for(const [k,v] of q)if(k!=='swf')params[k]=v;
window.addEventListener('load',()=>{const r=window.RufflePlayer.newest().createPlayer();r.style.width='100%';r.style.height='100%';
document.getElementById('game').appendChild(r);r.load({url:q.get('swf')||'game.swf',allowScriptAccess:true,scale:"showAll",forceScale:true,letterbox:"on",parameters:params});});
</script></body></html>
